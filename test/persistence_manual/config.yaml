# Standalone MMA2 native persistence manual test
# Run from the repository root with: python3 test/persistence_manual/test.py
persistence:
  enabled: true
  directory: test/persistence_manual/snapshots

listeners:
  - id: persistence-test
    listen: "127.0.0.1:15030"
    memory:
      - unit_id: 1
        coils: {start: 0, count: 16}
        discrete_inputs: {start: 0, count: 16}
        holding_registers: {start: 0, count: 32}
        input_registers: {start: 0, count: 16}
        policy:
          rules:
            - id: local-test
              source_ip: [127.0.0.1, "::1"]
              allow_fc: [1, 2, 3, 4, 5, 6, 15, 16]
