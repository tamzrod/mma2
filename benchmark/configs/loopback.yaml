# Dedicated benchmark fixture; never deploy to an operational network.
listeners:
  - id: benchmark-modbus
    listen: "127.0.0.1:15020"
    memory:
      - unit_id: 1
        holding_registers:
          start: 0
          count: 256
        policy:
          rules:
            - id: benchmark-local-read
              source_ip:
                - 127.0.0.1
              allow_fc: [3]
