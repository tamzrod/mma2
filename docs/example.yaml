# ============================================================
# MMA 2.0 – Canonical Example Configuration
# Demonstrates:
# - Multiple listeners (ports)
# - Multiple Unit IDs per port
# - Per-memory Modbus FC43 / MEI14 device identification
# - Access control with explicit allow_fc
# - State sealing (on selected units only)
#
# Runtime identity remains: (Port, UnitID)
# ============================================================

# Optional: enable verbose protocol-level logging (e.g. malformed packets).
# Defaults to false when absent.
# debug: true

# Optional: native persistence. Disabled when absent. When enabled, state is
# restored from disk snapshots before listeners accept connections, and every
# authoritative write is snapshotted. `directory` is required when enabled and
# holds one deterministic snapshot file per (port, unit_id). Omit `ranges` to
# persist every configured area of every configured memory identity; provide
# `ranges` to persist explicit subsets only (never clamped or remapped).
# persistence:
#   enabled: true
#   directory: /var/lib/mma2
#   ranges:
#     - port: 502
#       unit_id: 1
#       holding_registers: {start: 0, count: 256}
#       coils: {start: 0, count: 128}

listeners:
  # ------------------------------------------------------------
  # Listener on standard Modbus TCP port 502
  # ------------------------------------------------------------
  - id: main-modbus
    listen: ":502"

    memory:
      # ========================================================
      # UNIT ID 1 — OPEN DEVICE
      # ========================================================
      - unit_id: 1

        # Optional FC43 identity for this (Port, UnitID).
        # Omitted fields use compiled defaults.
        fc43:
          vendor_name: "github.com/tamzrod"
          product_code: "MMA2"
          major_minor_revision: "2.0"

        coils:
          start: 0
          count: 128

        holding_registers:
          start: 0
          count: 256

        input_registers:
          start: 0
          count: 256

        policy:
          rules:
            - id: allow-all
              source_ip:
                - 0.0.0.0/0
                - ::/0
                - 127.0.0.1
                - ::1
              allow_fc: [1,2,3,4,5,6,15,16,43]

      # ========================================================
      # UNIT ID 2 — CONTROLLED DEVICE
      # ========================================================
      - unit_id: 2

        # Independent identity for Unit ID 2.
        # Vendor and revision fall back to compiled defaults.
        fc43:
          product_code: "MMA2-Controlled"

        state_sealing:
          enabled: true
          area: coil
          address: 0
          exception: 0x06

        coils:
          start: 0
          count: 16

        holding_registers:
          start: 0
          count: 64

        policy:
          rules:
            - id: controller-rw
              source_ip:
                - 127.0.0.1
                - ::1
              allow_fc: [1,2,3,4,5,6,15,16,43]

            - id: lan-read
              source_ip:
                - 192.168.2.0/24
              allow_fc: [1,3,4,43]

  # ------------------------------------------------------------
  # Second listener on port 504
  # ------------------------------------------------------------
  - id: lab-modbus
    listen: ":504"

    memory:
      # Same Unit ID as the first listener, but a different
      # (Port, UnitID), so it may expose a different FC43 identity.
      - unit_id: 1

        fc43:
          vendor_name: "github.com/tamzrod"
          product_code: "MMA2-Lab"

        holding_registers:
          start: 0
          count: 32

        policy:
          rules:
            - id: lab-read
              source_ip:
                - 10.10.0.0/16
              allow_fc: [3,4,43]
